<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4px ランダム1ピクセル・モザイク</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    background: #111;
    color: #eee;
  }
  header {
    padding: 18px 22px;
    border-bottom: 1px solid #333;
    background: #181818;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0; color: #aaa; font-size: 13px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 22px;
    background: #202020;
  }
  label, button {
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 11px;
    background: #2a2a2a;
    color: #eee;
    font: inherit;
  }
  label { cursor: pointer; }
  input[type=file] { display: none; }
  input[type=number] {
    width: 70px;
    margin-left: 6px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #555;
    background: #111;
    color: #fff;
  }
  button { cursor: pointer; }
  button:hover, label:hover { background: #333; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .stage {
    padding: 20px;
    min-height: calc(100vh - 150px);
    display: grid;
    place-items: center;
    overflow: auto;
  }
  canvas {
    max-width: min(95vw, 1400px);
    max-height: 75vh;
    width: auto;
    height: auto;
    image-rendering: auto;
    background:
      linear-gradient(45deg,#292929 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg,#292929 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg,transparent 75%,#292929 75%) 0 0/16px 16px,
      linear-gradient(-45deg,transparent 75%,#292929 75%) 0 0/16px 16px,
      #222;
    box-shadow: 0 8px 35px #0008;
  }
  .status { margin-left: auto; color:#aaa; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>4pxブロック・ランダム1ピクセルモザイク</h1>
  <p>画像を4×4ピクセルのブロックに区切り、各ブロック内で選んだ1ピクセルの色を、同じブロック内の別のランダムな1ピクセルと入れ替えます。</p>
</header>

<div class="controls">
  <label>
    画像を選択
    <input id="file" type="file" accept="image/*">
  </label>

  <label>
    ブロックサイズ
    <input id="block" type="number" min="1" max="64" value="4">
    px
  </label>

  <button id="apply" disabled>モザイクを適用</button>
  <button id="reset" disabled>元画像に戻す</button>
  <button id="download" disabled>PNG保存</button>

  <span id="status" class="status">画像を選択してください</span>
</div>

<div class="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
(() => {
  const fileInput = document.getElementById('file');
  const blockInput = document.getElementById('block');
  const applyBtn = document.getElementById('apply');
  const resetBtn = document.getElementById('reset');
  const downloadBtn = document.getElementById('download');
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let original = null;
  let imageLoaded = false;

  function setStatus(text) {
    status.textContent = text;
  }

  function drawOriginal() {
    if (!original) return;
    canvas.width = original.width;
    canvas.height = original.height;
    ctx.putImageData(new ImageData(new Uint8ClampedArray(original.data), original.width, original.height), 0, 0);
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files?.[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      original = ctx.getImageData(0, 0, canvas.width, canvas.height);
      imageLoaded = true;

      applyBtn.disabled = false;
      resetBtn.disabled = false;
      downloadBtn.disabled = false;

      setStatus(`${canvas.width} × ${canvas.height}px`);
      URL.revokeObjectURL(url);
    };

    img.onerror = () => {
      setStatus('画像を読み込めませんでした');
      URL.revokeObjectURL(url);
    };

    img.src = url;
  });

  /*
    独自モザイク処理:
    - 画像を block × block に分割
    - 各ブロックからランダムに1ピクセル A を選ぶ
    - 同じブロックから別のランダムな1ピクセル B を選ぶ
    - A と B のRGBA値を交換
    - つまり各4×4ブロックにつき「1組だけ」色が入れ替わる
  */
  applyBtn.addEventListener('click', () => {
    if (!original) return;

    const size = Math.max(1, Math.min(64, Number(blockInput.value) || 4));
    blockInput.value = size;

    const w = original.width;
    const h = original.height;
    const data = new Uint8ClampedArray(original.data);

    let blocks = 0;

    for (let by = 0; by < h; by += size) {
      for (let bx = 0; bx < w; bx += size) {
        const bw = Math.min(size, w - bx);
        const bh = Math.min(size, h - by);
        const count = bw * bh;

        if (count < 2) continue;

        // ブロック内の2つの異なるピクセルをランダム選択
        const a = Math.floor(Math.random() * count);
        let b = Math.floor(Math.random() * (count - 1));
        if (b >= a) b++;

        const ax = bx + (a % bw);
        const ay = by + Math.floor(a / bw);
        const bx2 = bx + (b % bw);
        const by2 = by + Math.floor(b / bw);

        const ai = (ay * w + ax) * 4;
        const bi = (by2 * w + bx2) * 4;

        // RGBA 4チャンネルを交換
        for (let c = 0; c < 4; c++) {
          const tmp = data[ai + c];
          data[ai + c] = data[bi + c];
          data[bi + c] = tmp;
        }

        blocks++;
      }
    }

    canvas.width = w;
    canvas.height = h;
    ctx.putImageData(new ImageData(data, w, h), 0, 0);
    setStatus(`${size}×${size}px / ${blocks.toLocaleString()}ブロックを処理`);
  });

  resetBtn.addEventListener('click', () => {
    drawOriginal();
    setStatus('元画像に戻しました');
  });

  downloadBtn.addEventListener('click', () => {
    if (!imageLoaded) return;

    canvas.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'custom-mosaic.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
