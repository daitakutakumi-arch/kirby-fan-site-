<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>おはじきバトル vs BOT</title>

  <style>

    :root {
      --bg-color: #1a1a24;
      --panel-bg: #2a2a38;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;

      background: var(--bg-color);
      color: var(--text);

      font-family: sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;

      min-height: 100vh;

      touch-action: manipulation;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 20px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      width: 100%;
    }

    canvas {
      width: min(92vw, 400px);
      height: min(92vw, 400px);

      background:
        radial-gradient(
          circle,
          #3d3d52 0%,
          #1e1e28 100%
        );

      border: 6px solid #4a4a60;
      border-radius: 50%;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5);

      cursor: crosshair;

      touch-action: none;
    }

    .ui-panel {
      background: var(--panel-bg);

      padding: 12px;

      border-radius: 8px;

      width: min(380px, 94vw);

      display: flex;
      flex-direction: column;

      gap: 8px;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;

      font-size: 14px;
      font-weight: bold;

      gap: 8px;
    }

    .controls {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    button {
      background: #4b6584;

      color: white;

      border: none;

      padding: 8px 12px;

      border-radius: 4px;

      cursor: pointer;

      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-gacha {
      background: #eb3b5a;
    }

    .color-select {
      display: flex;

      gap: 7px;

      align-items: center;

      margin-top: 4px;
    }

    .color-btn {
      width: 24px;
      height: 24px;

      border-radius: 50%;

      border: 2px solid white;

      cursor: pointer;
    }

    .color-btn.selected {
      border: 2px solid #ffdd59;

      transform: scale(1.2);
    }

  </style>
</head>

<body>

  <h1>おはじきバトル (vs BOT)</h1>


  <div class="game-container">

    <canvas
      id="gameCanvas"
      width="400"
      height="400"
    ></canvas>


    <div class="ui-panel">

      <div class="status-bar">

        <span
          id="turnStatus"
          style="color:#4bcffa;"
        >
          プレイヤーのターン
        </span>

        <span id="scoreStatus">
          あなた: 4 / BOT: 4
        </span>

      </div>


      <div class="controls">

        <div>

          <span style="font-size:12px;">
            所持カラー:
          </span>

          <div
            class="color-select"
            id="colorContainer"
          ></div>

        </div>


        <button
          class="btn-gacha"
          id="gachaBtn"
        >
          ガチャ (無料)
        </button>


        <button id="resetBtn">
          リセット
        </button>

      </div>

    </div>

  </div>


<script>


// ========================================
// DOM
// ========================================

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

const turnStatus =
  document.getElementById("turnStatus");

const scoreStatus =
  document.getElementById("scoreStatus");

const colorContainer =
  document.getElementById("colorContainer");

const gachaBtn =
  document.getElementById("gachaBtn");

const resetBtn =
  document.getElementById("resetBtn");


// ========================================
// ゲーム設定
// ========================================

const R = 18;

// おはじきが消える範囲
// 元より少し大きくしている
const BOARD_R = 205;

const CENTER = 200;

const FRICTION = 0.98;

const RESTITUTION = 0.9;

const MAX_POWER = 18;


// ========================================
// カラー
// ========================================

const allGachaColors = [

  "#ff4757",
  "#2ed573",
  "#1e90ff",
  "#ffa502",
  "#9b59b6",
  "#eccc68",
  "#ff7ff3",
  "#70a1ff"

];


let unlockedColors = [

  "#ff4757",
  "#1e90ff",
  "#2ed573"

];


let playerColor = "#ff4757";


// ========================================
// ゲーム状態
// ========================================

let pieces = [];

let isPlayerTurn = true;

let isDragging = false;

let selectedPiece = null;

let dragCurrentPos = {
  x: 0,
  y: 0
};

let isMoving = false;


// BOTの次の行動待ち
window.botPending = false;


// ========================================
// おはじき
// ========================================

class Piece {

  constructor(
    x,
    y,
    isPlayer,
    color
  ) {

    this.x = x;
    this.y = y;

    this.vx = 0;
    this.vy = 0;

    this.isPlayer = isPlayer;

    this.color = color;

    this.isOut = false;
  }


  update() {

    if (this.isOut) {
      return;
    }


    this.x += this.vx;
    this.y += this.vy;


    this.vx *= FRICTION;
    this.vy *= FRICTION;


    // 動きがほぼ止まったら完全停止
    if (
      Math.hypot(
        this.vx,
        this.vy
      ) < 0.05
    ) {

      this.vx = 0;
      this.vy = 0;
    }


    // 盤面外へ出たか
    const distance =
      Math.hypot(
        this.x - CENTER,
        this.y - CENTER
      );


    if (distance > BOARD_R) {

      this.isOut = true;

      // 完全に停止
      this.vx = 0;
      this.vy = 0;
    }

  }


  draw() {

    if (this.isOut) {
      return;
    }


    ctx.save();


    // 本体
    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      R,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = this.color;

    ctx.fill();


    // 枠
    ctx.lineWidth = 3;

    ctx.strokeStyle =
      this.isPlayer
        ? "#ffffff"
        : "#333333";

    ctx.stroke();


    // 光沢
    ctx.beginPath();

    ctx.arc(
      this.x - R * 0.3,
      this.y - R * 0.3,
      R * 0.3,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.4)";

    ctx.fill();


    ctx.restore();
  }

}


// ========================================
// 衝突処理
// ========================================

function resolveCollisions() {

  for (
    let i = 0;
    i < pieces.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < pieces.length;
      j++
    ) {

      const p1 = pieces[i];

      const p2 = pieces[j];


      if (
        p1.isOut ||
        p2.isOut
      ) {
        continue;
      }


      let dx =
        p2.x - p1.x;

      let dy =
        p2.y - p1.y;

      let dist =
        Math.hypot(dx, dy);


      if (dist < R * 2) {

        // 完全に重なった場合
        if (dist === 0) {
          dist = 0.001;
        }


        const overlap =
          R * 2 - dist;


        const nx =
          dx / dist;

        const ny =
          dy / dist;


        // めり込みを修正
        p1.x -=
          nx * overlap / 2;

        p1.y -=
          ny * overlap / 2;


        p2.x +=
          nx * overlap / 2;

        p2.y +=
          ny * overlap / 2;


        const kx =
          p1.vx - p2.vx;

        const ky =
          p1.vy - p2.vy;


        const p =
          2 *
          (
            nx * kx +
            ny * ky
          ) / 2;


        p1.vx -=
          p * nx *
          RESTITUTION;

        p1.vy -=
          p * ny *
          RESTITUTION;


        p2.vx +=
          p * nx *
          RESTITUTION;

        p2.vy +=
          p * ny *
          RESTITUTION;

      }

    }

  }

}


// ========================================
// 狙い矢印
// ========================================

function drawArrow(
  startX,
  startY,
  endX,
  endY
) {

  const dx =
    startX - endX;

  const dy =
    startY - endY;


  const dist =
    Math.hypot(dx, dy);


  if (dist < 5) {
    return;
  }


  const angle =
    Math.atan2(dy, dx);


  const arrowLength =
    Math.min(dist, 120);


  const targetX =
    startX +
    Math.cos(angle) *
    arrowLength;


  const targetY =
    startY +
    Math.sin(angle) *
    arrowLength;


  // パワーによって色を変更
  const powerRatio =
    Math.min(
      dist / 100,
      1
    );


  const r =
    Math.floor(
      255 * powerRatio
    );


  const g =
    Math.floor(
      255 * (1 - powerRatio)
    );


  ctx.save();


  ctx.strokeStyle =
    `rgb(${r},${g},100)`;

  ctx.fillStyle =
    `rgb(${r},${g},100)`;


  ctx.lineWidth = 4;


  // 軸
  ctx.beginPath();

  ctx.moveTo(
    startX,
    startY
  );

  ctx.lineTo(
    targetX,
    targetY
  );

  ctx.stroke();


  // 矢印
  const headLength = 12;


  ctx.beginPath();

  ctx.moveTo(
    targetX,
    targetY
  );


  ctx.lineTo(
    targetX -
      headLength *
      Math.cos(
        angle - Math.PI / 6
      ),

    targetY -
      headLength *
      Math.sin(
        angle - Math.PI / 6
      )
  );


  ctx.lineTo(
    targetX -
      headLength *
      Math.cos(
        angle + Math.PI / 6
      ),

    targetY -
      headLength *
      Math.sin(
        angle + Math.PI / 6
      )
  );


  ctx.closePath();

  ctx.fill();


  ctx.restore();

}


// ========================================
// ゲーム初期化
// ========================================

function initGame() {

  pieces = [];


  // プレイヤー4個
  for (
    let i = 0;
    i < 4;
    i++
  ) {

    pieces.push(
      new Piece(
        110 + i * 60,
        320,
        true,
        playerColor
      )
    );

  }


  // BOT4個
  for (
    let i = 0;
    i < 4;
    i++
  ) {

    pieces.push(
      new Piece(
        110 + i * 60,
        80,
        false,
        "#718093"
      )
    );

  }


  isPlayerTurn = true;

  isDragging = false;

  selectedPiece = null;

  window.botPending = false;


  updateUI();

}


// ========================================
// ゲームループ
// ========================================

function gameLoop() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  isMoving = false;


  // 全おはじきを動かす
  pieces.forEach(p => {

    p.update();


    if (
      Math.hypot(
        p.vx,
        p.vy
      ) > 0
    ) {

      isMoving = true;

    }

  });


  // 衝突
  resolveCollisions();


  // 描画
  pieces.forEach(
    p => p.draw()
  );


  // 狙い矢印
  if (
    isDragging &&
    selectedPiece
  ) {

    drawArrow(
      selectedPiece.x,
      selectedPiece.y,
      dragCurrentPos.x,
      dragCurrentPos.y
    );

  }


  // ====================================
  // BOTのターン処理
  // ====================================

  if (
    !isMoving &&
    !isPlayerTurn &&
    window.botPending
  ) {

    window.botPending = false;


    // その時点での残り数を確認
    const botCount =
      pieces.filter(
        p =>
          !p.isPlayer &&
          !p.isOut
      ).length;


    const playerCount =
      pieces.filter(
        p =>
          p.isPlayer &&
          !p.isOut
      ).length;


    // BOTが全滅
    if (botCount === 0) {

      isPlayerTurn = true;

      updateUI();

    }

    // プレイヤーが全滅
    else if (playerCount === 0) {

      isPlayerTurn = true;

      updateUI();

    }

    // まだ両方残っている
    else {

      // ほぼ即BOTを出す
      setTimeout(
        botMove,
        50
      );

    }

  }


  updateUI();


  requestAnimationFrame(
    gameLoop
  );

}


// ========================================
// 超シンプルBOT
// ========================================

function botMove() {

  // ====================================
  // 最新の状態を確認
  // ====================================

  const botPieces =
    pieces.filter(
      p =>
        !p.isPlayer &&
        !p.isOut
    );


  const playerPieces =
    pieces.filter(
      p =>
        p.isPlayer &&
        !p.isOut
    );


  // ====================================
  // BOTが0個
  // ====================================

  if (
    botPieces.length === 0
  ) {

    window.botPending = false;

    isPlayerTurn = true;

    updateUI();

    return;
  }


  // ====================================
  // プレイヤーが0個
  // ====================================

  if (
    playerPieces.length === 0
  ) {

    window.botPending = false;

    isPlayerTurn = true;

    updateUI();

    return;
  }


  // ====================================
  // BOTのおはじきをランダム選択
  // ====================================

  const attacker =
    botPieces[
      Math.floor(
        Math.random() *
        botPieces.length
      )
    ];


  // ====================================
  // プレイヤーのおはじきをランダム選択
  // ====================================

  const target =
    playerPieces[
      Math.floor(
        Math.random() *
        playerPieces.length
      )
    ];


  // ====================================
  // 即発射
  // ====================================

  const angle =
    Math.atan2(
      target.y - attacker.y,
      target.x - attacker.x
    );


  // 強めに撃つ
  const power = 12;


  attacker.vx =
    Math.cos(angle) *
    power;


  attacker.vy =
    Math.sin(angle) *
    power;


  // プレイヤーへターン
  isPlayerTurn = true;

}


// ========================================
// 座標取得
// ========================================

function getPos(e) {

  const rect =
    canvas.getBoundingClientRect();


  const scaleX =
    canvas.width /
    rect.width;


  const scaleY =
    canvas.height /
    rect.height;


  const point =
    e.touches
      ? e.touches[0]
      : e;


  return {

    x:
      (point.clientX -
        rect.left) *
      scaleX,


    y:
      (point.clientY -
        rect.top) *
      scaleY

  };

}


// ========================================
// ドラッグ開始
// ========================================

function startDrag(e) {

  if (
    !isPlayerTurn ||
    isMoving
  ) {

    return;

  }


  e.preventDefault();


  const pos =
    getPos(e);


  pieces.forEach(p => {

    if (
      p.isPlayer &&
      !p.isOut &&
      Math.hypot(
        p.x - pos.x,
        p.y - pos.y
      ) < R
    ) {

      isDragging = true;

      selectedPiece = p;

      dragCurrentPos = pos;

    }

  });

}


// ========================================
// ドラッグ中
// ========================================

function moveDrag(e) {

  if (!isDragging) {
    return;
  }


  e.preventDefault();


  dragCurrentPos =
    getPos(e);

}


// ========================================
// 発射
// ========================================

function endDrag(e) {

  if (!isDragging) {
    return;
  }


  e.preventDefault();


  isDragging = false;


  if (!selectedPiece) {
    return;
  }


  const dx =
    selectedPiece.x -
    dragCurrentPos.x;


  const dy =
    selectedPiece.y -
    dragCurrentPos.y;


  let power =
    Math.hypot(
      dx,
      dy
    ) * 0.12;


  power =
    Math.min(
      power,
      MAX_POWER
    );


  if (power > 0) {

    const angle =
      Math.atan2(
        dy,
        dx
      );


    selectedPiece.vx =
      Math.cos(angle) *
      power;


    selectedPiece.vy =
      Math.sin(angle) *
      power;


    // プレイヤーのターン終了
    isPlayerTurn = false;


    // BOT待ち
    window.botPending = true;

  }


  selectedPiece = null;

}


// ========================================
// PCマウス操作
// ========================================

canvas.addEventListener(
  "mousedown",
  startDrag
);


canvas.addEventListener(
  "mousemove",
  moveDrag
);


canvas.addEventListener(
  "mouseup",
  endDrag
);


// ========================================
// スマホタッチ操作
// ========================================

canvas.addEventListener(
  "touchstart",
  startDrag,
  {
    passive: false
  }
);


canvas.addEventListener(
  "touchmove",
  moveDrag,
  {
    passive: false
  }
);


canvas.addEventListener(
  "touchend",
  endDrag,
  {
    passive: false
  }
);


// ========================================
// UI更新
// ========================================

function updateUI() {

  // 現在の残り数を毎回計算
  const playerCount =
    pieces.filter(
      p =>
        p.isPlayer &&
        !p.isOut
    ).length;


  const botCount =
    pieces.filter(
      p =>
        !p.isPlayer &&
        !p.isOut
    ).length;


  scoreStatus.innerText =
    `あなた: ${playerCount} / BOT: ${botCount}`;


  // ====================================
  // 勝敗
  // ====================================

  if (
    playerCount === 0 &&
    botCount === 0
  ) {

    turnStatus.innerText =
      "引き分け！";

    turnStatus.style.color =
      "#eccc68";

  }

  else if (
    botCount === 0
  ) {

    turnStatus.innerText =
      "あなたの勝利！";

    turnStatus.style.color =
      "#2ed573";

  }

  else if (
    playerCount === 0
  ) {

    turnStatus.innerText =
      "BOTの勝利...";

    turnStatus.style.color =
      "#eb3b5a";

  }

  else {

    turnStatus.innerText =
      isPlayerTurn
        ? "プレイヤーのターン"
        : "BOTのターン思考中...";


    turnStatus.style.color =
      isPlayerTurn
        ? "#4bcffa"
        : "#fffa65";

  }

}


// ========================================
// カラーパレット
// ========================================

function renderColorPalette() {

  colorContainer.innerHTML = "";


  unlockedColors.forEach(
    color => {

      const btn =
        document.createElement(
          "div"
        );


      btn.className =
        `color-btn ${
          color === playerColor
            ? "selected"
            : ""
        }`;


      btn.style.backgroundColor =
        color;


      btn.onclick = () => {

        playerColor =
          color;


        pieces.forEach(p => {

          if (p.isPlayer) {

            p.color =
              playerColor;

          }

        });


        renderColorPalette();

      };


      colorContainer.appendChild(
        btn
      );

    }
  );

}


// ========================================
// ガチャ
// ========================================

gachaBtn.onclick = () => {

  const locked =
    allGachaColors.filter(
      c =>
        !unlockedColors.includes(c)
    );


  if (
    locked.length === 0
  ) {

    alert(
      "すべての色を獲得済みです！"
    );

    return;
  }


  const newColor =
    locked[
      Math.floor(
        Math.random() *
        locked.length
      )
    ];


  unlockedColors.push(
    newColor
  );


  playerColor =
    newColor;


  pieces.forEach(p => {

    if (p.isPlayer) {

      p.color =
        playerColor;

    }

  });


  renderColorPalette();


  alert(
    "新しい色を獲得しました！"
  );

};


// ========================================
// リセット
// ========================================

resetBtn.onclick =
  initGame;


// ========================================
// ゲーム開始
// ========================================

renderColorPalette();

initGame();

gameLoop();


</script>

</body>
</html>
